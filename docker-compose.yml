services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: wedding-web-yarn
    container_name: wedding-web-frontend
    command: sh -lc "yarn install && yarn dev"
    env_file:
      - .env
    environment:
      HOST: ${HOST:-0.0.0.0}
      NUXT_HOST: ${NUXT_HOST:-0.0.0.0}
      PORT: ${NUXT_PORT:-3000}
      NUXT_PORT: ${NUXT_PORT:-3000}
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-true}
    ports:
      - "${APP_PORT:-3033}:${NUXT_PORT:-3000}"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    stdin_open: true
    tty: true

volumes:
  node_modules:
